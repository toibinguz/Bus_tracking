<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hà Nội Bus Live — Tra cứu xe buýt Hành khách</title>
  <link rel="icon" type="image/svg+xml" href="/static/bus_icon.svg">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/passenger.css">
</head>
<body>
  <div class="app-shell" id="appShell">
    <main class="map-stage" aria-label="Bản đồ tuyến xe buýt">
      <div id="map"></div>
      <button type="button" class="btn-expand-panel" id="btnExpandPanel" hidden aria-label="Mở bảng tra cứu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m9 18 6-6-6-6"/>
        </svg>
        <span>Tra cứu tuyến</span>
      </button>
    </main>

    <aside class="panel" id="passengerPanel" aria-label="Tra cứu tuyến và dự báo giờ xe đến">
      <div class="sheet-handle-row">
        <button type="button" class="sheet-handle" id="btnSheetCycle" aria-label="Thay đổi chiều cao bảng"></button>
      </div>

      <header class="panel-header">
        <div class="brand">
          <span class="brand-badge" aria-hidden="true">BUS</span>
          <div>
            <h1 class="brand-title">Hà Nội Bus Live</h1>
            <p class="brand-sub" id="routeSummaryText">Chọn tuyến và chạm trạm để xem giờ đến</p>
          </div>
        </div>
        <button type="button" class="btn-icon" id="btnCollapsePanel" title="Thu gọn bảng" aria-label="Thu gọn bảng">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m15 18-6-6 6-6"/>
          </svg>
        </button>
      </header>

      <section class="route-controls" aria-label="Chọn tuyến và chiều">
        <div class="combobox" id="routeCombobox">
          <label for="routeSearchInput" class="sr-only">Tìm tuyến xe buýt</label>
          <input type="text" id="routeSearchInput" class="route-input" placeholder="Tìm số hiệu hoặc tên tuyến (vd: 32, E03)..." autocomplete="off" />
          <button type="button" class="btn-clear-input" id="btnClearRouteSearch" hidden aria-label="Xóa từ khóa tuyến">✕</button>
          <div class="route-dropdown" id="routeDropdown" role="listbox" aria-label="Danh sách tuyến" hidden></div>
        </div>

        <div class="combobox" id="stationCombobox">
          <label for="stationSearchInput" class="sr-only">Chọn trạm trên tuyến</label>
          <input type="text" id="stationSearchInput" class="route-input" placeholder="Chọn hoặc tìm trạm trên tuyến..." autocomplete="off" />
          <button type="button" class="btn-clear-input" id="btnClearStationSearch" hidden aria-label="Xóa từ khóa trạm">✕</button>
          <div class="route-dropdown" id="stationDropdown" role="listbox" aria-label="Danh sách trạm" hidden></div>
        </div>

        <div class="direction-row">
          <div class="dir-switch" role="group" aria-label="Chiều hành trình">
            <button type="button" class="btn-dir active" data-dir="0" id="dirGoBtn">Chiều đi</button>
            <button type="button" class="btn-dir" data-dir="1" id="dirBackBtn">Chiều về</button>
          </div>
          <div class="live-meta">
            <span class="live-pill" id="liveStatusPill">
              <span class="dot" aria-hidden="true"></span>
              <span id="vehicleCount">0 xe</span>
            </span>
            <button type="button" class="btn-refresh" id="btnManualRefresh" title="Làm mới ngay" aria-label="Làm mới dữ liệu">
              <span id="countdown">15s</span>
            </button>
          </div>
        </div>

        <div class="alert-banner" id="upstreamAlert" hidden role="status"></div>
      </section>

      <div class="panel-body">
        <!-- Trạm đang ghim (tự ghim khi click trạm, không popup bản đồ) -->
        <section class="pinned-card" id="pinnedCard" hidden aria-live="polite"></section>
        <div class="eta-idle-hint" id="etaIdleHint">
          Chạm vào một trạm trên bản đồ hoặc chọn trạm ở ô phía trên để theo dõi giờ xe đến.
        </div>
      </div>

      <footer class="panel-footer">
        <span>Dữ liệu BusMap &amp; TimBus</span>
        <a href="/debug" class="debug-link">Debug</a>
      </footer>
      <div class="panel-resizer" id="panelResizer" role="separator" aria-orientation="vertical" aria-label="Kéo để thay đổi chiều rộng bảng"></div>
    </aside>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/static/bus_core.js"></script>
  <script src="/static/passenger.js"></script>
</body>
</html>
