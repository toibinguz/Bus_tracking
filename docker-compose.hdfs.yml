services:
  namenode:
    build:
      context: infra/hdfs
    command: ["/usr/local/bin/start-namenode.sh"]
    hostname: namenode
    ports:
      - "127.0.0.1:9870:9870"
    environment:
      HADOOP_HEAPSIZE_MAX: "128m"
      HDFS_NAMENODE_OPTS: "-Xmx384m -Xms128m"
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    volumes:
      - namenode-data:/data/dfs/name
    networks: [hdfs-private]
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -report | grep -q 'Live datanodes (2):'"]
      interval: 10s
      timeout: 5s
      retries: 18

  datanode-1:
    build:
      context: infra/hdfs
    command: ["/usr/local/bin/start-datanode.sh"]
    hostname: datanode-1
    depends_on:
      namenode:
        condition: service_started
    environment:
      HADOOP_HEAPSIZE_MAX: "128m"
      HDFS_DATANODE_OPTS: "-Xmx256m -Xms64m"
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.75
    volumes:
      - datanode-1-data:/data/dfs/data
    networks: [hdfs-private]

  datanode-2:
    build:
      context: infra/hdfs
    command: ["/usr/local/bin/start-datanode.sh"]
    hostname: datanode-2
    depends_on:
      namenode:
        condition: service_started
    environment:
      HADOOP_HEAPSIZE_MAX: "128m"
      HDFS_DATANODE_OPTS: "-Xmx256m -Xms64m"
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.75
    volumes:
      - datanode-2-data:/data/dfs/data
    networks: [hdfs-private]

  spark-master:
    build:
      context: .
      dockerfile: infra/spark/Dockerfile
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    hostname: spark-master
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:7077:7077"
    environment:
      SPARK_DAEMON_MEMORY: "192m"
    mem_limit: 1024m
    memswap_limit: 1024m
    cpus: 1.0
    volumes:
      - .:/workspace:ro
    networks: [hdfs-private]

  spark-worker-1:
    build:
      context: .
      dockerfile: infra/spark/Dockerfile
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on: [spark-master]
    environment:
      SPARK_DAEMON_MEMORY: "192m"
      SPARK_WORKER_MEMORY: "768m"
      SPARK_WORKER_CORES: "2"
    mem_limit: 1152m
    memswap_limit: 1152m
    cpus: 1.5
    networks: [hdfs-private]
    volumes:
      - .:/workspace:ro

  spark-worker-2:
    build:
      context: .
      dockerfile: infra/spark/Dockerfile
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on: [spark-master]
    environment:
      SPARK_DAEMON_MEMORY: "192m"
      SPARK_WORKER_MEMORY: "768m"
      SPARK_WORKER_CORES: "2"
    mem_limit: 1152m
    memswap_limit: 1152m
    cpus: 1.5
    networks: [hdfs-private]
    volumes:
      - .:/workspace:ro

  history-import:
    profiles: ["import"]
    build:
      context: .
      dockerfile: infra/spark/Dockerfile
    command: ["python3", "/workspace/scripts/hdfs_import_history.py", "upload", "--help"]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    volumes:
      - .:/workspace:ro
      - ./data/staging/hf_full_history:/import
    networks: [hdfs-private]

networks:
  hdfs-private:
    internal: true

volumes:
  namenode-data:
  datanode-1-data:
  datanode-2-data:
