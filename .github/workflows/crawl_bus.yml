name: HUST Bus Cluster 24x7 Cloud Crawler

on:
  schedule:
    # Chạy tự động mỗi 10 phút (Logic giờ Hà Nội 05:00 - 22:00 do script Python tự kiểm soát)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Cho phép bấm nút 'Run workflow' thủ công bất cứ lúc nào

jobs:
  crawl_and_sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Libraries
        run: |
          pip install huggingface_hub

      - name: Execute Crawler Step
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_ID: ${{ secrets.HF_DATASET_ID }}
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
        run: |
          python scripts/cloud_crawler_step.py

