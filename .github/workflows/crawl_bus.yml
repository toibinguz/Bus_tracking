name: HUST Bus Cluster 24x7 Cloud Crawler

on:
  schedule:
    # 22:00 UTC = 05:00 sáng Hà Nội (Đánh thức phiên tiếp sức đầu tiên mỗi sáng)
    - cron: '0 22 * * *'
  workflow_dispatch: # Cho phép kích hoạt thủ công khi cần

# 🔒 KHÓA ĐƠN TIẾN TRÌNH: Chỉ cho phép tối đa 1 runner chạy tại một thời điểm
concurrency:
  group: hust-bus-crawler-relay
  cancel-in-progress: false

jobs:
  crawl_and_sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Crawler Step (9-minute continuous loop)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_ID: ${{ secrets.HF_DATASET_ID }}
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
        run: |
          python scripts/cloud_crawler_step.py

      - name: Sync Updated Catalog to Git if Changed
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/metadata/
          if ! git diff --staged --quiet; then
            git commit -m "chore(catalog): daily auto-refresh vehicle catalog [skip ci]"
            git push origin main || echo "Git push skipped/failed gracefully"
          fi

      - name: Self-Trigger Next Run (Continuous Relay)
        if: success()
        run: |
          if [ -f .stop_chain ]; then
            echo "🌙 Da het gio xe buyt hoat dong (22:00). Tam dung day chuyen den 05:00 sang mai!"
          else
            echo "🚀 Kich hoat phien chay tiep theo tren GitHub Actions..."
            curl -X POST \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/crawl_bus.yml/dispatches \
              -d '{"ref":"main"}'
          fi
