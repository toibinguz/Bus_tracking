name: HUST Bus Cluster 24x7 Cloud Crawler

on:
  schedule:
    # Chạy mỗi 10 phút (UTC: 22h tối đến 15h chiều = 05h sáng đến 22h tối giờ Hà Nội)
    - cron: '*/10 22-23,0-15 * * *'
  workflow_dispatch: # Cho phép bấm nút 'Run workflow' thủ công trên web GitHub để test

jobs:
  crawl_and_sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Libraries
        run: |
          pip install huggingface_hub

      - name: Execute Crawler Step
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_ID: ${{ secrets.HF_DATASET_ID }}
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
        run: |
          python scripts/cloud_crawler_step.py

