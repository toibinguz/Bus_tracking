name: HUST Bus Cluster 24x7 Cloud Crawler

on:
  workflow_dispatch: # Cho phép kích hoạt thủ công khi cần

# 🔒 KHÓA ĐƠN TIẾN TRÌNH: Chỉ cho phép tối đa 1 runner chạy tại một thời điểm
concurrency:
  group: hust-bus-crawler-relay
  cancel-in-progress: false

jobs:
  crawl_and_sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Crawler Step (9-minute continuous loop)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_ID: ${{ secrets.HF_DATASET_ID }}
          TOMTOM_KEY: ${{ secrets.TOMTOM_KEY }}
        run: |
          python scripts/cloud_crawler_step.py

      - name: Sync Updated Catalog to Git if Changed
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add data/metadata/
          if ! git diff --staged --quiet; then
            git commit -m "chore(catalog): daily auto-refresh vehicle catalog [skip ci]"
            git push origin main || echo "Git push skipped/failed gracefully"
          fi

      - name: Self-Trigger Next Run (Continuous Relay 24/7)
        if: success()
        run: |
          echo "🚀 Kích hoạt phiên tiếp sức tiếp theo trên GitHub Actions (24/7)..."
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/crawl_bus.yml/dispatches \
            -d '{"ref":"main"}'
