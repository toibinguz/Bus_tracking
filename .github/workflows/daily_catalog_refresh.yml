name: Daily Bus Catalog Refresh (05:00 AM Hanoi)

on:
  schedule:
    # 21:50 UTC = 04:50 sáng Hà Nội (Chạy trước khi phiên cào 05:00 bắt đầu 10 phút)
    - cron: '50 21 * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công khi cần

jobs:
  refresh_catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Daily Catalog Health Check & Discovery
        run: |
          python scripts/daily_catalog_refresh.py

      - name: Commit and Push Updated Catalog if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/metadata/
          if git diff --staged --quiet; then
            echo "✅ Danh mục 220 xe không có thay đổi."
          else
            git commit -m "chore(catalog): auto-refresh vehicle catalog at 05:00 AM [skip ci]"
            git push origin main
            echo "🚀 Đã cập nhật danh bạ xe mới lên kho lưu trữ!"
          fi

